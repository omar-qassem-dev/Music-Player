<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive Music Player built with HTML, CSS and JavaScript">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header class="navbar">
        <div class="brand">
            <img src="image/logo.png" alt="Music Player Logo" class="logo">
            <h2>Music Player</h2>
        </div>
    </header>

    <main class="content">

        <div class="left-col">
            <h1>Feel<br>The<br>Music</h1>
        </div>

        <section class="player-panel" aria-label="Music player">

            <div class="track-info">
                <div class="cover-wrap">
                    <img src="img/cover-1.jpg" alt="Adham Nabulsi album art" class="cover" id="cover">
                </div>
                <div class="track-copy">
                    <span class="eyebrow">NOW PLAYING</span>
                    <h2 id="trackTitle">Taqabbalni</h2>
                    <p id="trackArtist">Adham Nabulsi</p>
                </div>
            </div>

            <div class="progress-wrap">
                <span id="currentTime">00:00</span>
                <input type="range" id="progressBar" min="0" max="100" value="0" aria-label="Music progress">
                <span id="duration">00:00</span>
            </div>

            <div class="main-controls">
                <button id="shuffleBtn" class="control-btn" type="button" aria-label="Shuffle">⇄</button>
                <button id="prevBtn" class="control-btn" type="button" aria-label="Previous">⏮</button>
                <button id="playPauseBtn" class="play-btn" type="button" aria-label="Play">▶</button>
                <button id="nextBtn" class="control-btn" type="button" aria-label="Next">⏭</button>
                <button id="repeatBtn" class="control-btn" type="button" aria-label="Repeat">↻</button>
            </div>

            <div class="volume-row">
                <span aria-hidden="true">🔊</span>
                <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="1" aria-label="Volume">
            </div>

            <div class="playlist" aria-label="Playlist">
                <div class="playlist-header">
                    <h3>Playlist</h3>
                    <span id="trackCount">3 tracks</span>
                </div>
                <div id="playlistItems"></div>
            </div>

        </section>
    </main>
</div>

<audio id="mySong" preload="auto"></audio>
<script src="main.js"></script>
</body>
</html>
